name: Go checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'ym-validate/**']

env:
  GOMAXPROCS: '2'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: go build -p 1 -o "$RUNNER_TEMP/ym" ./cmd/ym
      - run: go test -p 1 ./...
      - run: go vet -p 1 ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: staticcheck ./...
