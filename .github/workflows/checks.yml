name: Go checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'ym-validate/**']

env:
  GOMAXPROCS: '2'

concurrency:
  group: go-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: go build -p 1 -o "$RUNNER_TEMP/ym" ./cmd/ym
      - run: go vet -p 1 ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: staticcheck ./...
      - run: go test -p 1 ./internal/core ./internal/usage ./internal/intake ./internal/harness/claude ./internal/harness/codex ./internal/tui ./internal/cli
        if: startsWith(github.ref, 'refs/heads/ym-validate/')
      - run: go test -p 1 ./...
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -p 1 -o "$RUNNER_TEMP/ym-darwin-arm64" ./cmd/ym
      - uses: actions/upload-artifact@v4
        with:
          name: ym-darwin-arm64
          path: ${{ runner.temp }}/ym-darwin-arm64
